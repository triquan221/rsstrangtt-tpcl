<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Tân Thuận Tây</title>
    <style>
        /* --- CẤU HÌNH GIAO DIỆN --- */
        :root {
            --primary-color: #c0392b; /* Màu đỏ gạch/đất nung (Hợp với chủ đề đêm hội/du lịch) */
            --bg-color: #fff7ef;      /* MÀU NỀN THEO YÊU CẦU */
            --text-color: #5d4037;    /* Màu nâu đất (dễ đọc trên nền kem) */
            --card-shadow: 0 10px 30px rgba(93, 64, 55, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Ẩn thanh cuộn của body */
        }

        /* Container chính căn giữa */
        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 10px;
            align-items: center;
        }

        /* --- PHẦN TIÊU ĐỀ --- */
        .header-title {
            width: 100%;
            background-color: #fff7ef; /* Nền tiêu đề */
            text-align: center;
            padding: 10px 0 15px 0;
            z-index: 10;
        }

        .header-title h1 {
            color: var(--primary-color);
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }
        
        .header-deco {
            width: 60px;
            height: 3px;
            background-color: var(--text-color);
            margin: 0 auto;
            border-radius: 2px;
            opacity: 0.3;
        }

        /* --- KHUNG SLIDE --- */
        .gallery-card {
            flex: 1; /* Chiếm toàn bộ chiều cao còn lại */
            width: 100%;
            max-width: 1000px; /* Giới hạn chiều rộng để ảnh không bị vỡ trên màn hình quá to */
            background: #ffffff;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 4px solid #fff; /* Viền trắng mỏng bao quanh */
        }

        /* Màn hình hiển thị ảnh lớn */
        .main-stage {
            flex: 1;
            position: relative;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-stage img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
        }

        .main-stage img.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        /* Chú thích ảnh (Caption) */
        .caption-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            padding: 30px 20px 10px 20px;
            color: white;
            text-align: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none; /* Để click xuyên qua */
        }
        
        /* Chỉ hiện caption khi ảnh đã load xong */
        .main-stage:hover .caption-overlay, 
        .caption-overlay.show {
            opacity: 1;
        }

        /* Nút điều hướng */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            color: var(--primary-color);
            font-size: 20px;
            z-index: 10;
            transition: all 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .nav-btn:hover { background: var(--primary-color); color: white; }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        /* Thanh Thumbnail */
        .thumb-strip {
            height: 70px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            padding: 8px;
            display: flex;
            justify-content: center; /* Căn giữa thumbnail */
            gap: 8px;
            overflow-x: auto;
        }

        .thumb {
            height: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .thumb:hover { opacity: 1; }
        .thumb.selected {
            opacity: 1;
            border-color: var(--primary-color);
        }

    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header-title">
            <h1>Ảnh đẹp Không gian trải nghiệm "Đêm Tân Thuận Tây"</h1>
            <div class="header-deco"></div>
        </div>

        <div class="gallery-card">
            <div class="main-stage" id="mainStage">
                <button class="nav-btn prev-btn" onclick="changeSlide(-1)">❮</button>
                <button class="nav-btn next-btn" onclick="changeSlide(1)">❯</button>
                
                <div class="caption-overlay">
                    <span id="captionText">Loading...</span>
                </div>
            </div>

            <div class="thumb-strip" id="thumbStrip">
                </div>
        </div>
    </div>

    <script>
        // --- DỮ LIỆU CẤU HÌNH ---
        // Bạn hãy sửa nội dung chú thích (text) bên dưới cho phù hợp từng ảnh
        const slideData = [
            { url: "https://lh3.googleusercontent.com/d/11mlIsH5sNLKFfhysas8UrmNUWNuYhUfT=s0", text: "Khu vực check-in chào mừng" },
            { url: "https://lh3.googleusercontent.com/d/12b7Mrh2msQDmI18syLwjHeOv8DQFp9Kt=s0", text: "Không gian ẩm thực chợ quê" },
            { url: "https://lh3.googleusercontent.com/d/148kzYn99E8s746kDbZ2jMbY7mH-q-4_S=s0", text: "Biểu diễn đờn ca tài tử" },
            { url: "https://lh3.googleusercontent.com/d/14OTYNam5EIDVTlJbdsQdUql-6Ar5vhUq=s0", text: "Các sản phẩm OCOP địa phương" },
            { url: "https://lh3.googleusercontent.com/d/159Of__3PFqgkLvP1onu6ZWU3U7gcNoXd=s0", text: "Trải nghiệm làm bánh dân gian" },
            { url: "https://lh3.googleusercontent.com/d/16jDQHIbs8oDZhiALK4XPCap6LO1SVe0u=s0", text: "Du khách tham quan" },
            { url: "https://lh3.googleusercontent.com/d/17ufBDgEY3Woq4GRru-MTGCTb0ETnDPGz=s0", text: "Cảnh đẹp về đêm 1" },
            { url: "https://lh3.googleusercontent.com/d/1E8A9Ll-7eAO2I6FY1AkFPNKGIpsr1Gpe=s0", text: "Cảnh đẹp về đêm 2" },
            { url: "https://lh3.googleusercontent.com/d/1FLP6sVDfE8NZv-BWJ_XQygcngdfONRBh=s0", text: "Hoạt động vui chơi giải trí" },
            { url: "https://lh3.googleusercontent.com/d/1GsxfK2x--RobslM0r7svWjYwHl5h6KZ5=s0", text: "Giao lưu văn nghệ" },
            { url: "https://lh3.googleusercontent.com/d/1R4uLabCKY0kxsL3DUM_l8jZFRqph5nAz=s0", text: "Góc nhìn toàn cảnh" },
            { url: "https://lh3.googleusercontent.com/d/1RuDscMWPTy4jKMiISC0CCD8LeDlHOQg4=s0", text: "Đèn lồng trang trí" },
            { url: "https://lh3.googleusercontent.com/d/1Upj9BvvGqOdtX1X7TE9FFf8i01ejJw4p=s0", text: "Khách mời chụp ảnh lưu niệm" },
            { url: "https://lh3.googleusercontent.com/d/1_zqqy4-Rq2PJjcaKYfoWqGrAn4GP6z_K=s0", text: "Gian hàng thủ công mỹ nghệ" },
            { url: "https://lh3.googleusercontent.com/d/1bOhpJg9txemwUkLyZDY9bTH3UD59q3g7=s0", text: "Hình ảnh ấn tượng 14" },
            { url: "https://lh3.googleusercontent.com/d/1bWYUg16df9Y30R-6CcZLV1Z18mLsGNqu=s0", text: "Hình ảnh ấn tượng 15" },
            { url: "https://lh3.googleusercontent.com/d/1e97aLx1efyL4atbqHp8JTLyeeIa8CMkI=s0", text: "Hình ảnh ấn tượng 16" },
            { url: "https://lh3.googleusercontent.com/d/1ekNKvPUDyZTRJYs95PaHMA5EMJFqQtmk=s0", text: "Hình ảnh ấn tượng 17" },
            { url: "https://lh3.googleusercontent.com/d/1gEgAFMvLl2NNZRTvXy-nwmUjsLf4qOGi=s0", text: "Hình ảnh ấn tượng 18" },
            { url: "https://lh3.googleusercontent.com/d/1h7BDJZFwHtZX-e6j3izmd1UUUKjiHPLn=s0", text: "Hình ảnh ấn tượng 19" },
            { url: "https://lh3.googleusercontent.com/d/1hVOX9ff8wzEbrUOG7BFpx4gMHSBn3tUm=s0", text: "Hình ảnh ấn tượng 20" },
            { url: "https://lh3.googleusercontent.com/d/1ij45Nf8-C5fgbATv34GMNUlopewIBXD2=s0", text: "Hình ảnh ấn tượng 21" },
            { url: "https://lh3.googleusercontent.com/d/1jY2teCM6NQQrusxKxYKKOyGG5Xk3pR93=s0", text: "Hình ảnh ấn tượng 22" },
            { url: "https://lh3.googleusercontent.com/d/1jhjwMlVTQhbMSJoip2ZxPNMbKui6Q2oL=s0", text: "Hình ảnh ấn tượng 23" },
            { url: "https://lh3.googleusercontent.com/d/1osdOtJRa61C5xX1X2iL4_LU5TldOmGyL=s0", text: "Hình ảnh ấn tượng 24" },
            { url: "https://lh3.googleusercontent.com/d/1pd6ybBKKgvsTkVQKEfHQ93nrttnwf_4v=s0", text: "Hình ảnh ấn tượng 25" },
            { url: "https://lh3.googleusercontent.com/d/1uj-ZZsEMGWvU4_OQqy4PbGG1emw7fb0p=s0", text: "Kết thúc hành trình trải nghiệm" }
        ];

        let currentIndex = 0;
        let autoPlayTimer;
        const mainStage = document.getElementById('mainStage');
        const thumbStrip = document.getElementById('thumbStrip');
        const captionText = document.getElementById('captionText');
        const captionOverlay = document.querySelector('.caption-overlay');

        function initGallery() {
            slideData.forEach((item, index) => {
                // 1. Tạo ảnh lớn
                const img = document.createElement('img');
                img.src = item.url;
                img.id = `slide-${index}`;
                
                // Placeholder khi lỗi
                img.onerror = function() { 
                    this.src = "https://via.placeholder.com/800x600/eee/999?text=Đang+cập+nhật"; 
                };

                if (index === 0) img.classList.add('active');
                mainStage.appendChild(img);

                // 2. Tạo Thumbnail
                const thumb = document.createElement('img');
                thumb.src = item.url;
                thumb.className = 'thumb';
                thumb.onerror = function() { this.src = "https://via.placeholder.com/100/eee/999?text=Err"; };
                
                if (index === 0) thumb.classList.add('selected');
                
                thumb.onclick = () => {
                    goToSlide(index);
                    resetAutoPlay();
                };
                thumbStrip.appendChild(thumb);
            });
            
            // Set caption đầu tiên
            captionText.innerText = slideData[0].text;
            captionOverlay.classList.add('show');
            
            startAutoPlay();
        }

        function goToSlide(index) {
            document.getElementById(`slide-${currentIndex}`).classList.remove('active');
            thumbStrip.children[currentIndex].classList.remove('selected');

            currentIndex = index;
            if (currentIndex >= slideData.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = slideData.length - 1;

            document.getElementById(`slide-${currentIndex}`).classList.add('active');
            thumbStrip.children[currentIndex].classList.add('selected');
            
            thumbStrip.children[currentIndex].scrollIntoView({ 
                behavior: 'smooth', block: 'nearest', inline: 'center' 
            });

            // Update Caption
            captionText.innerText = slideData[currentIndex].text;
        }

        function changeSlide(direction) {
            goToSlide(currentIndex + direction);
            resetAutoPlay();
        }

        function startAutoPlay() {
            autoPlayTimer = setInterval(() => changeSlide(1), 4000);
        }

        function resetAutoPlay() {
            clearInterval(autoPlayTimer);
            startAutoPlay();
        }

        document.querySelector('.gallery-card').addEventListener('mouseenter', () => clearInterval(autoPlayTimer));
        document.querySelector('.gallery-card').addEventListener('mouseleave', startAutoPlay);

        initGallery();
    </script>
</body>
</html>
