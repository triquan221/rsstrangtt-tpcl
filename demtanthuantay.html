<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .slider-wrapper-pcl {
    max-width: 1014px;
    width: 100%;
    margin: 0 auto;
    font-family: Arial, sans-serif;
    background: rgba(246, 148, 13, 0.05); /* Màu nền nhạt từ #f6940d */
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border: 3px solid rgba(194, 65, 12, 0.4); /* Viền màu từ #c2410c */
    border-radius: 10px;
  }

  .slider-title-pcl {
    margin: 0;
    padding: 10px;
    font-size: 20px;
    text-align: center;
    background: linear-gradient(135deg, #c2410c, #f6940d); /* Gradient kết hợp 2 màu */
    color: #fff;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
  }

  .slides-pcl {
    position: relative;
    width: 100%;
    height: 527px;
    background: rgba(246, 148, 13, 0.1);
    overflow: hidden;
    border-bottom: 2px solid rgba(194, 65, 12, 0.4);
  }

  .slides-pcl img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    border-radius: 6px;
  }

  .slides-pcl img.active-pcl {
    display: block;
    animation: fadeInPcl 1.2s ease-in-out;
  }

  @keyframes fadeInPcl {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .thumbnails-pcl {
    display: flex;
    justify-content: flex-start;
    gap: 6px;
    padding: 6px;
    overflow-x: auto;
    background: rgba(246, 148, 13, 0.05);
    border-top: 2px solid rgba(194, 65, 12, 0.4);
    border-bottom: 2px solid rgba(194, 65, 12, 0.4);
    /* Cải thiện hiển thị thanh cuộn ngang */
    scrollbar-width: thin;
    scrollbar-color: #f6940d rgba(246, 148, 13, 0.2);
    scroll-behavior: smooth; /* Thêm smooth scroll cho container */
  }

  .thumbnails-pcl::-webkit-scrollbar {
    height: 8px;
  }
  .thumbnails-pcl::-webkit-scrollbar-track {
    background: rgba(246, 148, 13, 0.2);
    border-radius: 4px;
  }
  .thumbnails-pcl::-webkit-scrollbar-thumb {
    background: #f6940d;
    border-radius: 4px;
  }

  .thumbnails-pcl img {
    width: 100px;
    height: 75px;
    object-fit: cover;
    cursor: pointer;
    opacity: 0.6;
    border-radius: 4px;
    transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
    border: 2px solid transparent;
    flex-shrink: 0;
  }

  .thumbnails-pcl img.active-pcl,
  .thumbnails-pcl img:hover {
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 0 6px rgba(246, 148, 13, 0.8);
    border-color: #c2410c;
  }

  .caption-pcl {
    padding: 10px;
    text-align: center;
    font-size: 14px;
    background: rgba(246, 148, 13, 0.08);
    border-top: 2px solid rgba(194, 65, 12, 0.4);
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }
</style>
</head>
<body>

<div class="slider-wrapper-pcl">
  <h2 class="slider-title-pcl">Ảnh đẹp Không gian trải nghiệm "Đêm Tân Thuận Tây"</h2>

  <div class="slider-container-pcl">
    <div class="slides-pcl">
      <img src="https://lh3.googleusercontent.com/d/14NFGE2R-ekISTyoV-iyswgwuK-X7tS2C=s0" class="active-pcl">
      <img src="https://lh3.googleusercontent.com/d/1D1WbUa61xaIP9WrDf04ZgebSSg6h7Moo=s0">
      <img src="https://lh3.googleusercontent.com/d/1OMGH89qWtNmDnO9_dJBhQU4LCP-kdYB5=s0">
      <img src="https://lh3.googleusercontent.com/d/1XaVKNPj_jvmmeBky5z1YtBrAnaGc-T1_=s0">
      <img src="https://lh3.googleusercontent.com/d/1bjOBAP35ghFQEf_qCmWFIk6LCGFuWRuN=s0">
      <img src="https://lh3.googleusercontent.com/d/1dc6EkuDjdBEaYuDk-qiAVh3OswtGMGby=s0">
      <img src="https://lh3.googleusercontent.com/d/1nLSbqZApm6dFNuOigEH5-mE44k_Pp1hB=s0">
      <img src="https://lh3.googleusercontent.com/d/1oXXtCVGEHW8r1fWBO4Vu1eJC-LUxArnU=s0">
      <img src="https://lh3.googleusercontent.com/d/1oYEdCzuGLexxBedIhb3oE42pY1y1ijS-=s0">
      <img src="https://lh3.googleusercontent.com/d/1v5pCt5bOcdYLCKH55S3NyKxsoZJaGt4T=s0">
      <img src="https://lh3.googleusercontent.com/d/1vV5M6VKvi9UXdKY2aF0lLZUFfLq69n6V=s0">
    </div>

    <div class="thumbnails-pcl">
      <img src="https://lh3.googleusercontent.com/d/14NFGE2R-ekISTyoV-iyswgwuK-X7tS2C=s0" class="active-pcl">
      <img src="https://lh3.googleusercontent.com/d/1D1WbUa61xaIP9WrDf04ZgebSSg6h7Moo=s0">
      <img src="https://lh3.googleusercontent.com/d/1OMGH89qWtNmDnO9_dJBhQU4LCP-kdYB5=s0">
      <img src="https://lh3.googleusercontent.com/d/1XaVKNPj_jvmmeBky5z1YtBrAnaGc-T1_=s0">
      <img src="https://lh3.googleusercontent.com/d/1bjOBAP35ghFQEf_qCmWFIk6LCGFuWRuN=s0">
      <img src="https://lh3.googleusercontent.com/d/1dc6EkuDjdBEaYuDk-qiAVh3OswtGMGby=s0">
      <img src="https://lh3.googleusercontent.com/d/1nLSbqZApm6dFNuOigEH5-mE44k_Pp1hB=s0">
      <img src="https://lh3.googleusercontent.com/d/1oXXtCVGEHW8r1fWBO4Vu1eJC-LUxArnU=s0">
      <img src="https://lh3.googleusercontent.com/d/1oYEdCzuGLexxBedIhb3oE42pY1y1ijS-=s0">
      <img src="https://lh3.googleusercontent.com/d/1v5pCt5bOcdYLCKH55S3NyKxsoZJaGt4T=s0">
      <img src="https://lh3.googleusercontent.com/d/1vV5M6VKvi9UXdKY2aF0lLZUFfLq69n6V=s0">
    </div>
  </div>

  <div class="caption-pcl">Ảnh đẹp Không gian trải nghiệm "Đêm Tân Thuận Tây"</div>
</div>

<script>
(function(){
  let indexPcl = 0;
  const slidesPcl = document.querySelectorAll(".slides-pcl img");
  const thumbsPcl = document.querySelectorAll(".thumbnails-pcl img");
  const captionPcl = document.querySelector(".caption-pcl");
  
  // Tự động tạo mảng 27 caption tương ứng với 27 ảnh, sử dụng dấu nháy đơn để bọc chuỗi
  const captionsPcl = Array.from({length: slidesPcl.length}, (_, i) => 
    'Ảnh đẹp Không gian trải nghiệm "Đêm Tân Thuận Tây" ' + (i + 1).toString().padStart(2, '0')
  );

  const thumbnailsContainer = document.querySelector(".thumbnails-pcl");

  function showSlidePcl(i) {
    slidesPcl.forEach((img, idx) => img.classList.toggle("active-pcl", idx === i));
    thumbsPcl.forEach((img, idx) => img.classList.toggle("active-pcl", idx === i));
    
    // Khắc phục lỗi trôi trang: Chỉ tính toán và cuộn phần thanh thumbnail bên trong thay vì cuộn toàn trang
    const activeThumb = thumbsPcl[i];
    if(activeThumb && thumbnailsContainer) {
        const scrollLeftPos = activeThumb.offsetLeft - (thumbnailsContainer.clientWidth / 2) + (activeThumb.clientWidth / 2);
        thumbnailsContainer.scrollTo({
            left: scrollLeftPos,
            behavior: 'smooth'
        });
    }

    captionPcl.textContent = captionsPcl[i] || 'Ảnh đẹp Không gian trải nghiệm "Đêm Tân Thuận Tây"';
    indexPcl = i;
  }

  thumbsPcl.forEach((thumb, i) => {
    thumb.addEventListener("click", () => {
      clearTimeout(timerPcl);
      showSlidePcl(i);
      autoSlidePcl();
    });
  });

  let timerPcl;
  function autoSlidePcl() {
    clearTimeout(timerPcl);
    timerPcl = setTimeout(() => {
      let next = (indexPcl + 1) % slidesPcl.length;
      showSlidePcl(next);
      autoSlidePcl();
    }, 5000);
  }

  showSlidePcl(indexPcl);
  autoSlidePcl();
})();
</script>

</body>
</html>
