        // --- HỆ THỐNG ICON ---
        const Icons = {

            CalendarDays: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>,

        // --- COMPONENT ĐẾM NGƯỢC ---
        function CountdownTimer({ deadline, isSoldOut }) {
            const [timeLeft, setTimeLeft] = useState(calculateTimeLeft());

            function calculateTimeLeft() {
                const difference = +new Date(deadline) - +new Date();
                
                if (difference <= 0) return null; // Hết giờ

                return {
                    days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                    hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                    minutes: Math.floor((difference / 1000 / 60) % 60),
                    seconds: Math.floor((difference / 1000) % 60),
                };
            }

            useEffect(() => {
                if (isSoldOut) return; 
                const timer = setInterval(() => setTimeLeft(calculateTimeLeft()), 1000);
                return () => clearInterval(timer);
            }, [deadline, isSoldOut]);

            // TH0: Đã bán hết (Ưu tiên hiển thị)
            if (isSoldOut) {
                return (
                    <div className="flex items-center gap-2 bg-green-100 border border-green-200 text-green-700 px-3 py-2 rounded-lg font-bold shadow-sm w-full sm:w-auto mt-2 animate-in fade-in zoom-in">
                         <Icons.CheckCircle className="h-5 w-5"/>
                         <span className="uppercase text-sm">MẶT HÀNG ĐÃ ĐỦ SỐ LÔ CẦN BÁN</span>
                    </div>
                );
            }

            // TH1: Hết giờ
            if (!timeLeft) {
                return (
                    <div className="flex items-center gap-2 bg-red-100 border border-red-200 text-red-600 px-3 py-2 rounded-lg font-bold shadow-sm animate-pulse w-full sm:w-auto mt-2">
                         <Icons.AlarmClock className="h-5 w-5"/>
                         <span className="uppercase text-sm">HẾT THỜI GIAN ĐĂNG KÝ !</span>
                    </div>
                );
            }

            // TH2: Còn giờ
            return (
                <div className="flex flex-col gap-2 w-full sm:w-auto mt-2">
                    <div className="text-sm md:text-base text-blue-800 font-bold flex items-center gap-2">
                        <Icons.Clock className="h-5 w-5"/> Đăng ký kết thúc sau:
                    </div>
                    <div className="flex gap-2">
                        <div className="flex flex-col items-center bg-white border border-blue-200 rounded-lg p-1.5 min-w-[45px] shadow-sm">
                            <span className="text-lg font-bold text-blue-700 leading-none">{String(timeLeft.days).padStart(2,'0')}</span>
                            <span className="text-[9px] text-gray-500 uppercase mt-0.5">Ngày</span>
                        </div>
                        <div className="flex flex-col items-center bg-white border border-blue-200 rounded-lg p-1.5 min-w-[45px] shadow-sm">
                            <span className="text-lg font-bold text-blue-700 leading-none">{String(timeLeft.hours).padStart(2,'0')}</span>
                            <span className="text-[9px] text-gray-500 uppercase mt-0.5">Giờ</span>
                        </div>
                        <div className="flex flex-col items-center bg-white border border-blue-200 rounded-lg p-1.5 min-w-[45px] shadow-sm">

                            <span className="text-[9px] text-gray-500 uppercase mt-0.5">Phút</span>
                        </div>
                        <div className="flex flex-col items-center bg-white border border-red-200 rounded-lg p-1.5 min-w-[45px] shadow-sm">
                            <span className="text-lg font-bold text-red-600 leading-none">{String(timeLeft.seconds).padStart(2,'0')}</span>
                            <span className="text-[9px] text-red-400 uppercase mt-0.5">Giây</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENT CHÍNH ---
        function App() {

                                <p className="text-sm text-yellow-100 mt-1 italic font-medium opacity-90">(Thực hiện theo Kế hoạch số 2283/KH-UBND ngày 01/12/2025 của UBND phường Cao Lãnh)</p>

                    {/* MAIN CONTENT */}

                                <span className="ml-2 inline-block px-3 py-1 bg-green-50 text-green-700 font-bold border-2 border-green-500 rounded-lg text-sm">
                                    Ô MÀU XANH LÀ CÒN TRỐNG
                                </span>
                            </p>
                        </div>

                        {MARKETS_DATA.map(market => {
                            // Helper to get sold quantity safely
                            const getSoldQty = (sold) => Array.isArray(sold) ? sold.length : (typeof sold === 'number' ? sold : 0);

                            const totalAvailable = market.sections.reduce((sum, s) => sum + (s.count - getSoldQty(s.sold)), 0);
                            const totalItems = market.sections.reduce((sum, s) => sum + s.count, 0);
                            const isFull = totalAvailable === 0 && totalItems > 0;

                            return (
                                <div key={market.id} className="bg-white rounded-2xl shadow-md border border-stone-200 overflow-hidden hover:shadow-lg transition-shadow">
                                    {/* Market Header */}
                                    <div className="bg-gradient-to-r from-red-50 to-white p-5 border-b border-red-100 flex justify-between items-center">
                                        <div>
                                            <div className="flex items-center gap-3">
                                                <h3 className="text-xl md:text-2xl font-bold text-red-800 uppercase">{market.name}</h3>
                                                {isFull && <span className="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">HẾT CHỖ</span>}
                                            </div>
                                        </div>
                                        <div className="text-right flex flex-col items-end">
                                            <div className={`border-4 rounded-xl px-4 py-2 text-center shadow-sm min-w-[100px] ${isFull ? 'border-red-200 bg-red-50' : 'border-green-500 bg-white'}`}>
                                                <span className={`text-4xl md:text-5xl font-extrabold block leading-none ${isFull ? 'text-red-600' : 'text-green-600'}`}>{totalAvailable}</span>
                                                <span className="text-[10px] md:text-xs font-bold uppercase text-gray-400">Lô trống</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Market Sections */}
                                    <div className="divide-y divide-gray-100">
                                        {market.sections.map((section, idx) => {
                                            const soldQty = getSoldQty(section.sold);
                                            const availableCount = section.count - soldQty;
                                            const isSoldOut = availableCount === 0;
                                            const isExpired = new Date(DEADLINE) < new Date();

                                            return (
                                                <div key={idx} className={`p-5 flex flex-col md:flex-row justify-between gap-6 transition-colors ${isExpired && !isSoldOut ? 'bg-gray-50 opacity-80' : 'hover:bg-stone-50'}`}>
                                                    {/* Left Column */}
                                                    <div className="flex-1">
                                                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-3 gap-1">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-orange-500"><Icons.Tag className="h-5 w-5"/></span>
                                                                <span className="font-bold text-gray-800 text-lg md:text-xl">{section.label}</span>
                                                            </div>
                                                            <div className="text-lg md:text-xl font-bold text-red-600">
                                                                {new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(section.price)}/lô
                                                            </div>
                                                        </div>
                                                        
                                                        {/* Đồng hồ */}
                                                        <div className="mb-4">
                                                            <CountdownTimer deadline={DEADLINE} isSoldOut={isSoldOut} />
                                                        </div>

                                                        <div className="sm:ml-7 space-y-2 text-sm md:text-base text-gray-700">
                                                            <div className="flex items-start gap-2.5">
                                                                <span className="text-blue-500 flex-shrink-0 mt-0.5"><Icons.CalendarDays className="h-5 w-5"/></span>
                                                                <span><span className="font-bold text-gray-900">Thời gian mua bán:</span> {section.time}</span>
                                                            </div>
                                                            <div className="flex items-start gap-2.5">
                                                                <span className="text-red-500 flex-shrink-0 mt-0.5"><Icons.MapPin className="h-5 w-5"/></span>
                                                                <span><span className="font-bold text-gray-900">Vị trí:</span> {section.location}</span>
                                                            </div>
                                                            <div className="flex items-start gap-2.5">
                                                                <span className="text-green-600 flex-shrink-0 mt-0.5"><Icons.Maximize className="h-5 w-5"/></span>
                                                                <span><span className="font-bold text-gray-900">Diện tích:</span> {section.area}</span>
                                                            </div>
                                                            <div className="flex items-start gap-2.5">
                                                                <span className="text-purple-500 flex-shrink-0 mt-0.5"><Icons.LayoutGrid className="h-5 w-5"/></span>
                                                                <div>
                                                                    <span><span className="font-bold text-gray-900">Tổng số lượng:</span> {section.count} lô.</span>
                                                                    <div className="mt-1">
                                                                        <span className="text-sm font-bold text-gray-700 bg-gray-100 px-2 py-0.5 rounded border border-gray-300">
                                                                            Đã bán: {soldQty} lô
                                                                        </span>
                                                                    </div>
                                                                    <p className="text-red-600 font-bold mt-2 text-sm md:text-base">
                                                                        Do nhu cầu thực tế của tiểu thương, số lượng lô tại mỗi quầy có thể hết trước thời điểm dự kiến đã thông báo.
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Right Column: Big Number */}
                                                    <div className="flex-1 md:max-w-[200px] flex flex-col items-center justify-start border-t md:border-t-0 md:border-l md:pl-6 pt-4 md:pt-0 border-dashed border-gray-300">
                                                        {/* LOGIC MÀU SẮC ĐÃ CẬP NHẬT: 
                                                            - Hết lô (isSoldOut = true): Màu đỏ (border-red-500 bg-red-50)
                                                            - Còn lô (isSoldOut = false): 
                                                                + Nếu hết hạn (isExpired): Màu xám
                                                                + Nếu còn hạn: Màu xanh (border-green-500 bg-green-50)
                                                        */}
                                                        <div className={`w-full p-2 rounded-xl border-4 text-center mb-2 
                                                            ${isSoldOut 
                                                                ? 'border-red-500 bg-red-50' 
                                                                : (isExpired ? 'border-gray-300 bg-gray-100 text-gray-400' : 'border-green-500 bg-green-50')
                                                            }
                                                        `}>
                                                            <span className={`block font-extrabold leading-none 
                                                                ${isSoldOut 
                                                                    ? 'text-red-600 text-xl py-2 uppercase' 
                                                                    : (isExpired ? 'text-gray-500 text-3xl' : 'text-green-700 text-4xl')
                                                                }
                                                            `}>
                                                                {isSoldOut ? 'Đã hết lô' : availableCount}
                                                            </span>
                                                            <span className={`text-[10px] md:text-xs font-bold uppercase 
                                                                ${isSoldOut 
                                                                    ? 'text-red-800' 
                                                                    : (isExpired ? 'text-gray-500' : 'text-green-800')
                                                                }
                                                            `}>
                                                                {isSoldOut 
                                                                    ? 'Ngưng đăng ký' 
                                                                    : (isExpired ? 'ĐÃ KHÓA' : 'Số Lô còn lại')
                                                                }
                                                            </span>
                                                        </div>
                                                        
                                                        {/* Progress Bar Color Logic */}
                                                        <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden mb-2">
                                                            <div className={`h-full transition-all duration-500 
                                                                ${isSoldOut ? 'bg-red-500' : 'bg-green-500'}
                                                            `}
                                                                style={{ width: `${((section.count - availableCount) / section.count) * 100}%` }}></div>
                                                        </div>
                                                        <div className="text-xs text-gray-400 font-medium">Đã bán {Math.round(((section.count - availableCount)/section.count)*100)}%</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </main>

                    <footer className="mt-12 text-center text-gray-500 text-sm pb-8 font-medium">© 2026 Trung tâm Cung ứng Dịch vụ công Phường Cao Lãnh</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
