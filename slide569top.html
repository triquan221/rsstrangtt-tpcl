<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  /* Reset lề và thanh cuộn để xóa khoảng trắng */
  body, html {
    margin: 0 !important;
    padding: 0 !important;
    overflow-x: hidden;
    background: transparent;
    width: 100%;
    height: 100%;
  }

  .banner-slider-pcl {
    position: relative;
    width: 100%;
    /* Khóa cố định tỷ lệ khung theo đúng kích thước ảnh thật 1017x604 */
    aspect-ratio: 1017 / 604; 
    height: auto; /* Xóa 100vh để khung không bị ép theo chiều cao màn hình */
    overflow: hidden;
    border: none;
    margin: 0;
  }

  .banner-slides-pcl {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .banner-slides-pcl a {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
  }

  .banner-slides-pcl a.active-pcl {
    display: block;
  }

  .banner-slides-pcl img {
    width: 100%;
    height: 100%;
    /* Khung đã đúng tỷ lệ, nên dùng cover hay contain thì ảnh vẫn sẽ ôm trọn 100% không bị cắt */
    object-fit: contain; 
    display: block;
  }
</style>

<div class="banner-slider-pcl">
  <div class="banner-slides-pcl">

    <a href="https://caolanh.dongthap.gov.vn/" target="_blank" rel="noopener noreferrer">
      <img src="https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/195-pdf-1a.png" alt="Kỷ niệm 136 năm Ngày sinh Chủ tịch Hồ Chí Minh">
    </a>
    
    </div>
</div>

<script>
  const slidesPcl = document.querySelectorAll(".banner-slides-pcl a");
  
  let indexPcl = 0;
  let timerPcl;

  function showSlidePcl(i) {
    slidesPcl.forEach((slide, idx) => {
      slide.classList.toggle("active-pcl", idx === i);
    });
    indexPcl = i;
  }

  function nextSlidePcl() {
    let next = (indexPcl + 1) % slidesPcl.length;
    showSlidePcl(next);
  }

  function autoSlidePcl() {
    // Tự động chuyển ảnh sau 5 giây
    timerPcl = setInterval(nextSlidePcl, 5000);
  }

  // Khởi tạo
  if (slidesPcl.length > 0) {
    showSlidePcl(indexPcl);
    autoSlidePcl();
  }
</script>
