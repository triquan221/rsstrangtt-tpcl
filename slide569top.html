<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  /* Reset lề và thanh cuộn để xóa khoảng trắng */
  body, html {
    margin: 0 !important;
    padding: 0 !important;
    overflow-x: hidden;
    background: transparent;
    width: 100%;
    height: 100%;
  }

  .banner-slider-pcl {
    position: relative;
    width: 100%;
    /* Khóa cố định tỷ lệ khung theo đúng kích thước ảnh thật 1017x604 */
    aspect-ratio: 1017 / 604; 
    height: auto;
    overflow: hidden;
    border: none;
    margin: 0;
  }

  /* Khung chứa các slide - Thiết lập dạng Flex để xếp hàng ngang */
  .banner-slides-pcl {
    display: flex;
    width: 100%;
    height: 100%;
    /* Hiệu ứng trượt mượt mà trong 0.5s */
    transition: transform 0.5s ease-in-out; 
  }

  .banner-slides-pcl a {
    flex: 0 0 100%; /* Mỗi slide chiếm trọn 100% chiều rộng */
    width: 100%;
    height: 100%;
    display: block;
  }

  .banner-slides-pcl img {
    width: 100%;
    height: 100%;
    object-fit: contain; 
    display: block;
  }

  /* Nút điều hướng trái/phải */
  .nav-btn-pcl {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.3);
    color: white;
    border: none;
    cursor: pointer;
    padding: 10px 15px;
    font-size: 20px;
    z-index: 10;
    transition: background-color 0.3s;
    border-radius: 4px;
  }

  .nav-btn-pcl:hover {
    background-color: rgba(0, 0, 0, 0.8);
  }

  .prev-pcl {
    left: 10px;
  }

  .next-pcl {
    right: 10px;
  }
</style>

<div class="banner-slider-pcl">
  <div class="banner-slides-pcl">

      <a href="#" target="_blank" rel="noopener noreferrer">
      <img src=" https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/giadinhvanhoa.jpg" alt="Slide 2">
    </a>
    
    <a href="https://caolanh.dongthap.gov.vn/" target="_blank" rel="noopener noreferrer">
      <img src="https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/195-pdf-1a.png" alt="Kỷ niệm 136 năm Ngày sinh Chủ tịch Hồ Chí Minh">
    </a>
    
    <a href="https://drive.google.com/file/d/1Pc6yakw6PvGNa8G6KFApehMnuN0fbuPt/view?usp=sharing" target="_blank" rel="noopener noreferrer">
      <img src="https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/e10.png" alt="Slide 2">
    </a>

    <a href="#" target="_blank" rel="noopener noreferrer">
      <img src=" https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/115%20nam.png" alt="Slide 2">
    </a>

   

   
  </div>

  <button class="nav-btn-pcl prev-pcl">&#10094;</button>
  <button class="nav-btn-pcl next-pcl">&#10095;</button>
</div>

<script>
  const slidesContainerPcl = document.querySelector(".banner-slides-pcl");
  const slidesPcl = document.querySelectorAll(".banner-slides-pcl a");
  const prevBtnPcl = document.querySelector(".prev-pcl");
  const nextBtnPcl = document.querySelector(".next-pcl");
  
  let indexPcl = 0;
  let timerPcl;

  // Hàm cập nhật vị trí trượt
  function updateSlidePositionPcl() {
    slidesContainerPcl.style.transform = `translateX(-${indexPcl * 100}%)`;
  }

  // Chuyển sang ảnh tiếp theo
  function nextSlidePcl() {
    indexPcl = (indexPcl + 1) % slidesPcl.length;
    updateSlidePositionPcl();
    resetAutoSlidePcl(); // Reset lại thời gian tự động trượt khi người dùng tự bấm
  }

  // Quay lại ảnh trước đó
  function prevSlidePcl() {
    indexPcl = (indexPcl - 1 + slidesPcl.length) % slidesPcl.length;
    updateSlidePositionPcl();
    resetAutoSlidePcl();
  }

  // Thiết lập tự động trượt
  function startAutoSlidePcl() {
    timerPcl = setInterval(nextSlidePcl, 5000);
  }

  function resetAutoSlidePcl() {
    clearInterval(timerPcl);
    startAutoSlidePcl();
  }

  // Gắn sự kiện click cho 2 nút
  nextBtnPcl.addEventListener("click", nextSlidePcl);
  prevBtnPcl.addEventListener("click", prevSlidePcl);

  // --- TÍNH NĂNG VUỐT TRÊN ĐIỆN THOẠI (SWIPE) ---
  let startXPcl = 0;
  let endXPcl = 0;

  slidesContainerPcl.addEventListener("touchstart", (e) => {
    startXPcl = e.touches[0].clientX;
  });

  slidesContainerPcl.addEventListener("touchend", (e) => {
    endXPcl = e.changedTouches[0].clientX;
    handleSwipePcl();
  });

  function handleSwipePcl() {
    const swipeThreshold = 50; // Quãng đường vuốt tối thiểu để kích hoạt chuyển ảnh
    if (startXPcl - endXPcl > swipeThreshold) {
      nextSlidePcl(); // Vuốt sang trái
    } else if (endXPcl - startXPcl > swipeThreshold) {
      prevSlidePcl(); // Vuốt sang phải
    }
  }

  // Khởi động slider nếu có ảnh
  if (slidesPcl.length > 0) {
    startAutoSlidePcl();
  }
</script>
