<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  /* Reset lề và thanh cuộn để xóa khoảng trắng */
  body, html {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden;
    background: transparent;
    width: 100%;
    height: 100%;
  }

  .banner-slider-pcl {
    position: relative;
    width: 100vw;   /* Ép lấp đầy 100% chiều rộng iframe */
    height: 100vh;  /* Ép lấp đầy 100% chiều cao iframe */
    overflow: hidden;
    border: none;
    margin: 0;
  }

  .banner-slides-pcl {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .banner-slides-pcl a {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
  }

  .banner-slides-pcl a.active-pcl {
    display: block;
  }

  .banner-slides-pcl img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Phủ kín toàn bộ khung, triệt để xóa viền trắng */
    display: block;
  }

  /* Nút điều khiển trái/phải */
  .banner-prev-pcl,
  .banner-next-pcl {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    background: rgba(0,0,0,0.35);
    color: white;
    border: none;
    cursor: pointer;
    z-index: 10;
    font-size: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
  }

  .banner-prev-pcl:hover,
  .banner-next-pcl:hover {
    background: rgba(0,0,0,0.6);
  }

  .banner-prev-pcl { left: 12px; }
  .banner-next-pcl { right: 12px; }

  /* Responsive cho nút bấm */
  @media (max-width: 768px) {
    .banner-prev-pcl,
    .banner-next-pcl {
      width: 34px;
      height: 34px;
      font-size: 16px;
    }
  }

  @media (max-width: 480px) {
    .banner-prev-pcl,
    .banner-next-pcl {
      width: 26px;
      height: 26px;
      font-size: 13px;
    }
  }
</style>

<div class="banner-slider-pcl">
  <div class="banner-slides-pcl">

    <a href="https://caolanh.dongthap.gov.vn/" target="_blank" rel="noopener noreferrer">
      <img src="https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/195-pdf-1a.png" alt="Kỷ niệm 51 năm">
    </a>

  </div>

  <button class="banner-prev-pcl">&#10094;</button>
  <button class="banner-next-pcl">&#10095;</button>
</div>

<script>
  const slidesPcl = document.querySelectorAll(".banner-slides-pcl a");
  const prevPcl = document.querySelector(".banner-prev-pcl");
  const nextPcl = document.querySelector(".banner-next-pcl");

  let indexPcl = 0;
  let timerPcl;

  function showSlidePcl(i) {
    slidesPcl.forEach((slide, idx) => {
      slide.classList.toggle("active-pcl", idx === i);
    });
    indexPcl = i;
  }

  function nextSlidePcl() {
    let next = (indexPcl + 1) % slidesPcl.length;
    showSlidePcl(next);
  }

  function prevSlidePcl() {
    let prev = (indexPcl - 1 + slidesPcl.length) % slidesPcl.length;
    showSlidePcl(prev);
  }

  // Bắt sự kiện click cho 2 nút
  nextPcl.addEventListener("click", () => {
    clearInterval(timerPcl);
    nextSlidePcl();
    autoSlidePcl();
  });

  prevPcl.addEventListener("click", () => {
    clearInterval(timerPcl);
    prevSlidePcl();
    autoSlidePcl();
  });

  function autoSlidePcl() {
    timerPcl = setInterval(nextSlidePcl, 5000);
  }

  // Khởi tạo
  showSlidePcl(indexPcl);
  autoSlidePcl();
</script>
