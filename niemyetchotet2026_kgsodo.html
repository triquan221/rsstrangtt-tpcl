                    { label: 'Dưa hấu, Bông chậu', count: 30, price: 200000, time: '10 ngày: 07/02 - 16/02/2026 (20 - 29 Tết)', location: 'Khu Hoa viên', area: '3m x 3m / 3m x 4m', sold: [] },
                    { label: 'Hàng Tết', count: 24, price: 100000, time: '05 ngày: 12/02 - 16/02/2026 (25 - 29 Tết)', location: 'Vỉa hè đường xã', area: '2m x 3m', sold: [] }

        ];
        // ==================================================================================


        // --- HỆ THỐNG ICON ---
        const Icons = {

        };

                    {/* HEADER */}

                                </div>
                                <div>

                            const totalItems = market.sections.reduce((sum, s) => sum + s.count, 0);
                            const isFull = totalAvailable === 0 && totalItems > 0;

                            return (
                                <div key={market.id} className="bg-white rounded-2xl shadow-md border border-stone-200 overflow-hidden hover:shadow-lg transition-shadow">
                                    {/* Market Header */}
                                    <div className="bg-gradient-to-r from-red-50 to-white p-5 border-b border-red-100 flex justify-between items-center">
                                        <div>
                                            <div className="flex items-center gap-3">
                                                <h3 className="text-xl md:text-2xl font-bold text-red-800 uppercase">{market.name}</h3>
                                                {isFull && <span className="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">HẾT CHỖ</span>}
                                            </div>
                                        </div>
                                        <div className="text-right flex flex-col items-end">
                                            <div className={`border-4 rounded-xl px-4 py-2 text-center shadow-sm min-w-[100px] ${isFull ? 'border-red-200 bg-red-50' : 'border-green-500 bg-white'}`}>

                                            </div>

                                            const availableCount = section.count - section.sold.length;
                                            
                                            return (
                                                <div key={idx} className="p-5 flex flex-col md:flex-row justify-between gap-6 hover:bg-stone-50 transition-colors">
                                                    {/* Left Column: Info */}
                                                    <div className="flex-1">
                                                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-3 gap-1">

                                                            </div>

                                                        <div className="sm:ml-7 space-y-2 text-sm md:text-base text-gray-700">

                                                                </div>
                                                            </div>

                                                            <div className="flex items-start gap-2.5 px-3">
                                                                <span className="text-red-500 flex-shrink-0 mt-0.5"><Icons.MapPin className="h-5 w-5"/></span>

                                                            </div>
                                                            <div className="flex items-start gap-2.5 px-3">
                                                                <span className="text-green-600 flex-shrink-0 mt-0.5"><Icons.Maximize className="h-5 w-5"/></span>

                                                            </div>
                                                            <div className="flex items-start gap-2.5 px-3">
                                                                <span className="text-purple-500 flex-shrink-0 mt-0.5"><Icons.LayoutGrid className="h-5 w-5"/></span>
                                                                <span><span className="font-bold text-gray-900">Tổng số lượng:</span> {section.count} lô</span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Right Column: Big Number & Status */}
                                                    <div className="flex-1 md:max-w-[200px] flex flex-col items-center justify-start border-t md:border-t-0 md:border-l md:pl-6 pt-4 md:pt-0 border-dashed border-gray-300">

                                                            </span>

                                                        <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden mb-2">

                                                    </div>
                                                </div>
                                            );
                                        })}
