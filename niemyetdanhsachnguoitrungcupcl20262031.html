<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- Tích hợp Tailwind CSS -->

    <!-- Tích hợp Font từ Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Cấu hình màu sắc đồng bộ theo tông Đơn vị 01 */
        :root {
            --accent-yellow: #fce118;   
            --header-footer-bg: #a21817; 
            --bg-page: #fffcf5;         
            --text-main: #1a202c;
            --primary-red: #a21817;     
            --bg-pink: #fff1f2;        
            --border-pink: #fda4af;

        }

        body {

            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .header-bg { background-color: var(--header-footer-bg); }
        .footer-bg { 
            background-color: var(--header-footer-bg); 
            border-top: 6px solid var(--accent-yellow); 
        }
        
        .candidate-card { 
            border-radius: 0.75rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .candidate-card:hover {
            transform: translateY(-5px);
            filter: brightness(1.02);
            box-shadow: 0 20px 25px -5px rgba(162, 24, 23, 0.15);
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-full relative">

    <!-- LỚP NỀN TRỐNG ĐỒNG WATERMARK -->

    <script>
        // Cấu hình tông màu đồng bộ

        const electoralData = [

                candidates: [

                candidates: [

                candidates: [

            },
            { id: 7, name: "ĐƠN VỊ BẦU CỬ SỐ 07", info: "Số đại biểu trúng cử: 03 người", areas: "Khóm Tân Tịch, khóm Tân Thuận, khóm Tân Việt Hòa, khóm Tịnh Thới",
                candidates: [ 
                    { name: "Ông THÁI VĂN LÀNH", dob: "01/01/1975", position: "Ủy viên Ban Thường vụ Đảng ủy, Bí thư Chi bộ, Chủ nhận UBMTTQ Việt Nam phường Cao Lãnh" }, 
                    { name: "Bà LÊ THỊ DUY LINH", dob: "20/10/1991", position: "Đảng ủy viên, Phó Bí thư Chi bộ, Phó Chủ tịch UBMTTQ Việt Nam phường Cao Lãnh, Chủ tịch Hội LHPN phường Cao Lãnh" },

                ] 
            },
            { id: 8, name: "ĐƠN VỊ BẦU CỬ SỐ 08", info: "Số đại biểu trúng cử: 03 người", areas: "Khóm Tịnh Châu, khóm Tịnh Đông, khóm Tịnh Long, khóm Tịnh Mỹ, khóm Tịnh Hưng",
                candidates: [ 
                    { name: "Bà PHAN THỊ HỒNG THANH", dob: "21/12/1979", position: "Ủy viên Ban Thường vụ Đảng ủy, Bí thư Chi bộ, Phó Chủ tịch HĐND phường Cao Lãnh" }, 
                    { name: "Ông NGUYỄN VĂN TUẤN", dob: "01/01/1978", position: "Đảng ủy viên, Ủy viên BTV Hội Nông dân tỉnh, Phó Chủ tịch Thường trực UBMTTQ Việt Nam phường Cao Lãnh, Chủ tịch Hội Nông dân phường Cao Lãnh" }, 
                    { name: "Ông VÕ TẤN BẢO", dob: "09/01/1982", position: "Bí thư Chi bộ, Giám đốc HTX dịch vụ nông nghiệp Tịnh Thới" } 
                ] 
            },
            { id: 9, name: "ĐƠN VỊ BẦU CỬ SỐ 09", info: "Số đại biểu trúng cử: 03 người", areas: "Khóm Tân Chú, khóm Tân Hùng, khóm Tân Dân, khóm Tân Hậu",
                candidates: [ 
                    { name: "Ông NGUYỄN VĂN TỒN", dob: "05/07/1976", position: "Ủy viên Ban Thường vụ Đảng ủy, Bí thư Đảng ủy cơ sở, Trưởng Công an phường Cao Lãnh" }, 
                    { name: "Ông PHAN VĂN LƯỠNG", dob: "03/02/1976", position: "Đảng ủy viên, Ủy viên BTV Liên đoàn Lao động tỉnh, Phó Chủ tịch UBMTTQ Việt Nam phường Cao Lãnh, Chủ tịch Công đoàn phường Cao Lãnh" }, 
                    { name: "Ông TRẦN VĂN THỦY", dob: "10/10/1960", position: "Phó Ban trị sự Giáo hội Phật giáo Việt Nam tỉnh Đồng Tháp" } 
                ] 
            },
            { id: 10, name: "ĐƠN VỊ BẦU CỬ SỐ 10", info: "Số đại biểu trúng cử: 03 người", areas: "Khóm Đông Định, khóm Đông Hòa, khóm Đông Thạnh, khóm Tân Phát",
                candidates: [ 
                    { name: "Ông NGUYỄN TẤN PHÁT", dob: "16/08/1990", position: "Ủy viên Ban Thường vụ Đảng ủy, Bí thư Chi bộ, Chánh Văn phòng Đảng ủy phường Cao Lãnh" }, 
                    { name: "Ông TRẦN MINH HIẾU", dob: "28/01/1985", position: "Đảng viên, Khóm Đội trưởng, Phó Trưởng khóm Đông Thạnh" }, 
                    { name: "Ông NGUYỄN QUỐC QUI", dob: "07/11/1993", position: "Bí thư Chi bộ, Trưởng khóm Tân Phát" } 
                ] 
            }
        ];

        // Hàm loại bỏ dấu tiếng Việt
        function removeVietnameseTones(str) {
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g,"a"); 
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g,"e"); 
            str = str.replace(/ì|í|ị|ỉ|ĩ/g,"i"); 
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g,"o"); 
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g,"u"); 
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g,"y"); 
            str = str.replace(/đ/g,"d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            return str;
        }

        // Hàm format tên file chuẩn: bỏ "Ông/Bà", viết liền không dấu
        function formatFileName(name) {
            let cleanName = name.replace(/^(Ông|Bà)\s+/i, '').trim();
            cleanName = removeVietnameseTones(cleanName).toLowerCase().replace(/\s+/g, '');
            return cleanName;
        }

        // Hàm xử lý lỗi ảnh: Thử PNG nếu JPG lỗi
        window.handleImgError = function(img, pngUrl) {
            if (img.src.includes('.jpg')) {
                img.src = pngUrl; 
            } else {
                img.style.display = 'none'; 
                if (img.nextElementSibling) img.nextElementSibling.style.display = 'flex'; 
            }
        };

        function renderApp() {
            const container = document.getElementById('electoral-units-container');
            const ts = new Date().getTime(); // Dùng timestamp để tránh cache ảnh cũ trên trình duyệt
            let html = '';

            electoralData.forEach((unit) => {
                let candidatesHtml = '';
                unit.candidates.forEach((candidate) => {
                    const titleMatch = candidate.name.match(/^(Ông|Bà)\s+(.*)/i);
                    const title = titleMatch ? `${titleMatch[1]}:` : "";
                    const fullName = titleMatch ? titleMatch[2] : candidate.name;
                    
                    // Xử lý link ảnh Github chuẩn xác
                    const imgFileName = formatFileName(candidate.name);
                    const jpgUrl = `https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/${imgFileName}.jpg?v=${ts}`;
                    const pngUrl = `https://raw.githubusercontent.com/triquan221/rsstrangtt-tpcl/main/${imgFileName}.png?v=${ts}`;

                    candidatesHtml += `
                        <div class="candidate-card p-3 shadow-sm hover:shadow-2xl flex flex-col h-full group overflow-hidden border-[3px]" 
                             style="background-color: ${globalTheme.bg}; border-color: ${globalTheme.border};">
                            
                            <div class="absolute top-0 left-0 w-full h-[6px] opacity-0 group-hover:opacity-100 transition-opacity" style="background-color: var(--accent-yellow);"></div>
                            
                            <div class="flex flex-col gap-3 items-center w-full mb-3 pt-2 flex-1">
                                <!-- Khung ảnh 4x6 chuẩn (160x240px) -->
                                <div class="bg-gray-50 border-4 rounded-lg p-[2px] flex-shrink-0 flex flex-col items-center justify-center shadow-inner overflow-hidden relative transition-transform duration-300 group-hover:scale-105"
                                     style="width: 160px; height: 240px; border-color: ${globalTheme.primary};">
                                    <img src="${jpgUrl}" alt="${fullName}" onerror="handleImgError(this, '${pngUrl}')" class="w-full h-full object-cover rounded-sm absolute inset-0 z-10" />
                                    <div class="absolute inset-0 z-0 flex flex-col items-center justify-center h-full w-full bg-gray-100 opacity-50 hidden fallback-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: ${globalTheme.primary}; opacity: 0.7;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                        <span class="text-[12px] mt-2 font-bold uppercase text-center leading-tight" style="color: ${globalTheme.primary}; opacity: 0.9;">Chưa có ảnh</span>
                                    </div>
                                </div>

                                <div class="flex flex-col w-full text-center justify-start flex-1 px-1">
                                    <div class="font-bold uppercase leading-tight mb-3 min-h-[4rem] flex items-center justify-center flex-wrap w-full text-[22px]" style="color: ${globalTheme.primary};">
                                        ${title ? `<span class="font-normal normal-case mr-2 opacity-90 text-slate-600">${title}</span>` : ''}
                                        <span>${fullName}</span>
                                    </div>
                                    
                                    <!-- Box thông tin Ngày sinh & Chức vụ -->
                                    <div class="w-full text-left text-[22px] text-gray-800 bg-[#fffbeb] p-3 sm:p-4 rounded-md border shadow-sm mt-auto flex flex-col flex-1 gap-3" style="border-color: ${globalTheme.border};">
                                        <div class="border-b pb-3 shrink-0 leading-relaxed" style="border-bottom-color: ${globalTheme.border};">
                                            <span class="font-bold mr-1" style="color: ${globalTheme.primary}">Ngày sinh:</span>
                                            <span class="font-semibold text-gray-900">${candidate.dob || '...'}</span>
                                        </div>
                                        <div class="flex-1 leading-relaxed">
                                            <span class="font-bold mr-1" style="color: ${globalTheme.primary}">Chức vụ:</span>
                                            <span class="font-medium text-gray-900">${candidate.position || '...'}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="rounded-2xl shadow-xl overflow-hidden border-[3px]" style="background-color: #ffffff; border-color: ${globalTheme.primary};">
                        <!-- Header Đơn vị -->
                        <div class="px-4 py-4 sm:px-6 sm:py-5 flex flex-col sm:flex-row justify-between items-center sm:items-center gap-3 sm:gap-4" style="background-color: ${globalTheme.primary};">
                            <div class="flex flex-col text-center sm:text-left gap-1 sm:gap-1.5 flex-1">
                                <h3 class="text-xl sm:text-2xl md:text-[28px] font-bold uppercase tracking-wide text-white drop-shadow-sm leading-tight">
                                    ${unit.name}
                                </h3>
                                <div class="text-[22px] text-white/95 leading-snug">
                                    <span class="font-bold" style="color: var(--accent-yellow);">Khu vực bầu cử: </span>
                                    <span class="font-medium text-white">${unit.areas}</span>
                                </div>
                            </div>
                            <div class="shrink-0 flex items-center mt-3 sm:mt-0">
                                <span class="text-[22px] font-black px-5 py-2.5 sm:px-6 sm:py-3 rounded-full shadow-lg whitespace-nowrap" style="color: ${globalTheme.primary}; background-color: var(--accent-yellow);">
                                    ${unit.info}
                                </span>
                            </div>
                        </div>

                        <!-- Lưới ứng viên -->
                        <div class="p-4 sm:p-6 lg:p-8 w-full" style="background-color: ${globalTheme.bg};">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 sm:gap-6 lg:gap-10 w-full">
                                ${candidatesHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
