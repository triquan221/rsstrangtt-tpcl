<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu dọc bầu cử</title>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: transparent;
    }

    .vertical-menu {
        max-width: none;
        background: linear-gradient(180deg, #1f8edc, #176fb8);
        border-radius: 10px;
        padding: 8px 0;
        color: #ffffff;
    }

    .vertical-menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .vertical-menu li {
        position: relative;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.25);
    }

    .vertical-menu li:last-child {
        border-bottom: none;
    }

    .vertical-menu li a {
        text-decoration: none;
        color: #ffffff;
        font-size: 17px;
        font-weight: 500;
        display: block;
    }

    .vertical-menu li:hover {
        background: rgba(255,255,255,0.15);
    }
</style>
</head>

<body>
<div class="vertical-menu">
    <ul>
        <li>
            <a href="#" target="_blank" rel="noopener noreferrer">
                Giới thiệu
            </a>
        </li>

        <li>
            <a href="https://caolanh.dongthap.gov.vn/chuy%C3%AAn-trang-h%C4%90nd-ph%C6%B0%E1%BB%9Dng-cao-l%C3%A3nh"
   target="_blank"
   rel="noopener noreferrer">
   Cơ cấu tổ chức
</a>

        </li>

        <li>
            <a href="#" target="_blank" rel="noopener noreferrer">
                Chức năng nhiệm vụ
            </a>
        </li>

        <li>
            <a href="#" target="_blank" rel="noopener noreferrer">
                Tài liệu họp HĐND Phường
            </a>
        </li>

        <li>
            <a href="#" target="_blank" rel="noopener noreferrer">
                Danh sách người ứng cử
            </a>
        </li>
    </ul>
</div>
</body>
</html>
