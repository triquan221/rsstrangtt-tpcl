<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Menu dọc bầu cử</title>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: transparent;
    }

    .vertical-menu {
        width: 100%;              /* KHÔNG GIỚI HẠN CHIỀU RỘNG */
        max-width: none;          /* đảm bảo không bị bó */
        background: linear-gradient(180deg, #1f8edc, #176fb8);
        border-radius: 10px;
        padding: 8px 0;
        color: #ffffff;
    }

    .vertical-menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .vertical-menu li {
        position: relative;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.25);
    }

    .vertical-menu li:last-child {
        border-bottom: none;
    }

    .vertical-menu li a {
        text-decoration: none;
        color: #ffffff;
        font-size: 17px;
        font-weight: 500;
        display: block;
    }

    /* Mũi tên submenu */
    .vertical-menu li.has-sub::after {
        content: "›";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 22px;
        color: #ffffff;
    }

    /* Hover */
    .vertical-menu li:hover {
        background: rgba(255,255,255,0.15);
    }

    /* Submenu */
    .vertical-menu ul.submenu {
        display: none;
        background: rgba(0,0,0,0.15);
    }

    .vertical-menu li:hover > ul.submenu {
        display: block;
    }

    .vertical-menu ul.submenu li {
        padding: 12px 30px;
        font-size: 15px;
    }
</style>
</head>

<body>
<div class="vertical-menu">
    <ul>
        <li class="has-sub">
            <a href="#">Hội đồng bầu cử quốc gia</a>
            <ul class="submenu">
                <li><a href="#">Giới thiệu</a></li>
                <li><a href="#">Cơ cấu tổ chức</a></li>
            </ul>
        </li>

        <li>
            <a href="#">Ủy ban bầu cử địa phương</a>
        </li>

        <li>
            <a href="#">Tập hợp văn bản pháp luật</a>
        </li>

        <li>
            <a href="#">Hướng dẫn công tác bầu cử</a>
        </li>

        <li>
            <a href="#">Hỏi đáp bầu cử</a>
        </li>

        <li class="has-sub">
            <a href="#">Danh sách người ứng cử</a>
            <ul class="submenu">
                <li><a href="#">Quốc hội</a></li>
                <li><a href="#">HĐND các cấp</a></li>
            </ul>
        </li>

        <li class="has-sub">
            <a href="#">Danh sách người trúng cử</a>
            <ul class="submenu">
                <li><a href="#">Quốc hội</a></li>
                <li><a href="#">HĐND các cấp</a></li>
            </ul>
        </li>
    </ul>
</div>
</body>
</html>
