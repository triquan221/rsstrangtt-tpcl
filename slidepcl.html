<style>
  .slider-wrapper-pcl {
    max-width: 1014px;
    width: 100%;
    margin: 0 auto;
    font-family: Arial, sans-serif;
    background: rgba(93,169,233,0.08);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border: 3px solid rgba(93,169,233,0.4);
    border-radius: 10px;
  }

  .slider-title-pcl {
    margin: 0;
    padding: 10px;
    font-size: 20px;
    text-align: center;
    background-color: #1d5c9a;
    color: #fff;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
  }

  .slides-pcl {
    position: relative;
    width: 100%;
    height: 527px;
    background: rgba(93,169,233,0.1);
    overflow: hidden;
    border-bottom: 2px solid rgba(93,169,233,0.4);
  }

  .slides-pcl img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    border-radius: 6px;
  }

  .slides-pcl img.active-pcl {
    display: block;
    animation: fadeInPcl 1.2s ease-in-out;
  }

  @keyframes fadeInPcl {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .thumbnails-pcl {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 6px;
    overflow-x: auto;
    background: rgba(93,169,233,0.1);
    border-top: 2px solid rgba(93,169,233,0.4);
    border-bottom: 2px solid rgba(93,169,233,0.4);
  }

  .thumbnails-pcl img {
    width: 100px;
    height: 75px;
    object-fit: cover;
    cursor: pointer;
    opacity: 0.6;
    border-radius: 4px;
    transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
    border: 2px solid transparent;
  }

  .thumbnails-pcl img.active-pcl,
  .thumbnails-pcl img:hover {
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 0 6px rgba(93,169,233,0.6);
    border-color: rgba(93,169,233,0.5);
  }

  .caption-pcl {
    padding: 10px;
    text-align: center;
    font-size: 14px;
    background: rgba(93,169,233,0.08);
    border-top: 2px solid rgba(93,169,233,0.4);
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }
</style>

<script>
(function(){
  let indexPcl = 0;
  const slidesPcl = document.querySelectorAll(".slides-pcl img");
  const thumbsPcl = document.querySelectorAll(".thumbnails-pcl img");
  const captionPcl = document.querySelector(".caption-pcl");

  const captionsPcl = [
    "Ảnh đẹp phường Cao Lãnh 01", "Ảnh đẹp phường Cao Lãnh 02", "Ảnh đẹp phường Cao Lãnh 03",
    "Ảnh đẹp phường Cao Lãnh 04", "Ảnh đẹp phường Cao Lãnh 05", "Ảnh đẹp phường Cao Lãnh 06",
    "Ảnh đẹp phường Cao Lãnh 07", "Ảnh đẹp phường Cao Lãnh 08", "Ảnh đẹp phường Cao Lãnh 09",
    "Ảnh đẹp phường Cao Lãnh 10", "Ảnh đẹp phường Cao Lãnh 11", "Ảnh đẹp phường Cao Lãnh 12",
    "Ảnh đẹp phường Cao Lãnh 13", "Ảnh đẹp phường Cao Lãnh 14", "Ảnh đẹp phường Cao Lãnh 15",
    "Ảnh đẹp phường Cao Lãnh 16", "Ảnh đẹp phường Cao Lãnh 17", "Ảnh đẹp phường Cao Lãnh 18",
    "Ảnh đẹp phường Cao Lãnh 19"
  ];

  function showSlidePcl(i) {
    slidesPcl.forEach((img, idx) => img.classList.toggle("active-pcl", idx === i));
    thumbsPcl.forEach((img, idx) => img.classList.toggle("active-pcl", idx === i));
    captionPcl.textContent = captionsPcl[i];
    indexPcl = i;
  }

  thumbsPcl.forEach((thumb, i) => {
    thumb.addEventListener("click", () => {
      clearTimeout(timerPcl);
      showSlidePcl(i);
      autoSlidePcl();
    });
  });

  let timerPcl;
  function autoSlidePcl() {
    clearTimeout(timerPcl);
    timerPcl = setTimeout(() => {
      let next = (indexPcl + 1) % slidesPcl.length;
      showSlidePcl(next);
      autoSlidePcl();
    }, 5000);
  }

  showSlidePcl(indexPcl);
  autoSlidePcl();
})();
</script>
