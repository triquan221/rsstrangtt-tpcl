<div style="border:1px solid #90caf9; border-radius:6px; width:100%; font-family:'Tahoma, sans-serif'; background:#fff;">
  <div style="background:#0f5ab1; color:#fff; font-weight:600; padding:10px 10px; border-radius:6px 6px 0 0; font-size:18px;">
    Tin tức Chuyển đổi số nổi bật
  </div>

  <div id="news-ticker" style="height:180px; overflow:hidden; position:relative; background:#fff; padding:6px 10px;">
    <ul id="news-list" style="list-style-type:disc; padding-left:18px; margin:0; color:#232323; font-size:18px; font-family:'Tahoma, sans-serif'; line-height:1.6;">
      <li>⏳ Đang tải thông báo...</li>
    </ul>
  </div>
</div>

<script>
(function() {
  const rssUrl = 'https://mst.gov.vn/rss/trien-khai-thuc-hien-nghi-quyet-57.rss';
  const proxy = 'https://api.allorigins.win/get?url=';

  let newsItems = [];
  let position = 0;
  let tickerInterval = null;
  const scrollSpeed = 0.3;     // tốc độ px mỗi lần
  const refreshDelay = 25;     // ms giữa các bước cuộn
  const refreshInterval = 60 * 60 * 1000; // 60 phút

  async function loadNews() {
    stopTicker();
    const ul = document.getElementById('news-list');
    ul.innerHTML = '<li>⏳ Đang tải thông báo...</li>';

    try {
      const res = await fetch(`${proxy}${encodeURIComponent(rssUrl)}`);
      const data = await res.json();

      const parser = new DOMParser();
      const xml = parser.parseFromString(data.contents, "application/xml");
      const items = xml.querySelectorAll("item");
      newsItems = Array.from(items).slice(0, 10).map(item => ({
        title: item.querySelector("title")?.textContent || "",
        link: item.querySelector("link")?.textContent || "#"
      }));

      if (newsItems.length === 0) throw new Error("Không có tin RSS");

      ul.innerHTML = newsItems.map(item => `
        <li style="margin-bottom:8px;">
          <a href="${item.link}" target="_blank" style="text-decoration:none; color:#0b3a4a;">
            ${item.title}
          </a>
        </li>
      `).join('');

      // Nhân đôi danh sách để cuộn liên tục
      ul.innerHTML += ul.innerHTML;

      position = 0;
      startTicker();
    } catch (e) {
      console.error(e);
      ul.innerHTML = '<li>Lỗi tải thông báo.</li>';
    }
  }

  function startTicker() {
    if (tickerInterval) return;
    const list = document.getElementById('news-list');
    const listHeight = list.scrollHeight / 2;

    tickerInterval = setInterval(() => {
      position -= scrollSpeed;
      if (Math.abs(position) >= listHeight) position = 0;
      list.style.transform = `translateY(${position}px)`;
    }, refreshDelay);
  }

  function stopTicker() {
    if (tickerInterval) {
      clearInterval(tickerInterval);
      tickerInterval = null;
    }
  }

  const container = document.getElementById('news-ticker');
  container.addEventListener('mouseenter', stopTicker);
  container.addEventListener('mouseleave', startTicker);

  loadNews();
  setInterval(loadNews, refreshInterval);
})();
</script>
