<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  .banner-slider-pcl {
    position: relative;
    max-width: 899px;              /* Giới hạn chiều ngang */
    aspect-ratio: 899 / 569;       /* Tỷ lệ khung hình 899x569 */
    width: 100%;                   /* Co giãn theo màn hình */
    overflow: hidden;
    border: none;
    margin: 0 auto;                /* Căn giữa khung */
  }

  .banner-slides-pcl {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .banner-slides-pcl a {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
  }

  .banner-slides-pcl a.active-pcl {
    display: block;
  }

  .banner-slides-pcl img {
    width: 100%;
    height: 100%;
    object-fit: contain;              /* Giữ nguyên tỷ lệ ảnh */
    background: rgba(255,255,255,0.7);
  }

  /* Nút điều khiển trái/phải */
  .banner-prev-pcl,
  .banner-next-pcl {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    background: rgba(0,0,0,0.35);
    color: white;
    border: none;
    cursor: pointer;
    z-index: 10;
    font-size: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
  }

  .banner-prev-pcl:hover,
  .banner-next-pcl:hover {
    background: rgba(0,0,0,0.6);
  }

  .banner-prev-pcl { left: 12px; }
  .banner-next-pcl { right: 12px; }

  /* Responsive */
  @media (max-width: 768px) {
    .banner-prev-pcl,
    .banner-next-pcl {
      width: 34px;
      height: 34px;
      font-size: 16px;
    }
  }

  @media (max-width: 480px) {
    .banner-prev-pcl,
    .banner-next-pcl {
      width: 26px;
      height: 26px;
      font-size: 13px;
    }
  }
</style>

<div class="banner-slider-pcl">
  <div class="banner-slides-pcl">
    <a href="https://drive.google.com/file/d/1-EdtrRmBR-kEY-Qapea-ScuDU33cQgxh/view?usp=sharing"
       target="_blank" rel="noopener noreferrer">
      <img src="https://caolanh.dongthap.gov.vn/documents/146679/0/thi+dua+yeu+nuoc.jpg/357207d2-768a-ed61-1dca-570699d7f1fc?t=1759392305929">
    </a>

    <a href="https://pbgdpl.dongthap.gov.vn/chi-tiet-tin/?/tai-lieu-cuoc-thi-truc-tuyen-tim-hieu-kien-thuc-phap-luat-tren-ia-ban-tinh-nam-2025/60002927"
       target="_blank" rel="noopener noreferrer">
      <img src="https://pbgdpl.dongthap.gov.vn/documents/18106246/18145602//18106246_18145602_161201_06102025.jpg">
    </a>
  </div>

  <button class="banner-prev-pcl">&#10094;</button>
  <button class="banner-next-pcl">&#10095;</button>
</div>

<script>
  const slidesPcl = document.querySelectorAll(".banner-slides-pcl a");
  const prevPcl = document.querySelector(".banner-prev-pcl");
  const nextPcl = document.querySelector(".banner-next-pcl");

  let indexPcl = 0;
  let timerPcl;

  function showSlidePcl(i) {
    slidesPcl.forEach((slide, idx) => {
      slide.classList.toggle("active-pcl", idx === i);
    });
    indexPcl = i;
  }

  function nextSlidePcl() {
    let next = (indexPcl + 1) % slidesPcl.length;
    showSlidePcl(next);
  }

  function prevSlidePcl() {
    let prev = (indexPcl - 1 + slidesPcl.length) % slidesPcl.length;
    showSlidePcl(prev);
  }

  nextPcl.addEventListener("click", () => {
    clearInterval(timerPcl);
    nextSlidePcl();
    autoSlidePcl();
  });

  prevPcl.addEventListener("click", () => {
    clearInterval(timerPcl);
    prevSlidePcl();
    autoSlidePcl();
  });

  function autoSlidePcl() {
    timerPcl = setInterval(nextSlidePcl, 5000);
  }

  // Khởi tạo
  showSlidePcl(indexPcl);
  autoSlidePcl();
</script>
