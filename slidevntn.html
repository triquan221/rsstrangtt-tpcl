<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: #fafafa;
    padding: 20px 0;
  }

  .slider-wrapper-pcl {
    max-width: 1014px;
    width: 100%;
    margin: 0 auto;
    font-family: 'Arial', sans-serif;
    background: #ffffff; /* Nền trắng tinh gọn */
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    border: 3px solid #F494A2; /* Viền chính slide màu hồng */
    border-radius: 10px;
    overflow: hidden; /* Cắt góc chuẩn */
  }

  .slider-title-pcl {
    margin: 0;
    padding: 12px 10px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    background: #EC2780; /* Đổi màu nền chữ thành hồng #EC2780 */
    color: #fff;
  }

  .slides-pcl {
    position: relative;
    width: 100%;
    height: 527px;
    background: #F493A0; /* Màu nền ảnh màu hồng */
    overflow: hidden;
    border-bottom: 2px solid #F494A2; /* Đường phân cách màu hồng */
  }

  .slides-pcl img {
    position: absolute;
    max-width: 100%;
    max-height: 100%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    border-radius: 6px;
  }

  .slides-pcl img.active-pcl {
    display: block;
    animation: fadeInPcl 1.2s ease-in-out;
  }

  @keyframes fadeInPcl {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .thumbnails-pcl {
    display: flex;
    justify-content: flex-start;
    gap: 8px;
    padding: 10px;
    overflow-x: auto;
    background: rgba(244, 147, 160, 0.1); /* Nền hồng cực nhạt */
    border-bottom: 2px solid #F494A2;
    /* Cải thiện thanh cuộn cho khớp màu */
    scrollbar-width: thin;
    scrollbar-color: #F494A2 rgba(244, 147, 160, 0.2);
    scroll-behavior: smooth;
  }

  .thumbnails-pcl::-webkit-scrollbar {
    height: 8px;
  }
  .thumbnails-pcl::-webkit-scrollbar-track {
    background: rgba(244, 147, 160, 0.2);
    border-radius: 4px;
  }
  .thumbnails-pcl::-webkit-scrollbar-thumb {
    background: #F494A2;
    border-radius: 4px;
  }

  .thumbnails-pcl img {
    width: 100px;
    height: 75px;
    object-fit: cover;
    cursor: pointer;
    opacity: 0.5;
    border-radius: 6px;
    transition: all 0.3s ease;
    border: 2px solid transparent;
    flex-shrink: 0;
  }

  .thumbnails-pcl img.active-pcl,
  .thumbnails-pcl img:hover {
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 0 8px rgba(244, 148, 162, 0.6); /* Glow hồng */
    border-color: #F494A2; /* Viền khi chọn */
  }

  .caption-pcl {
    padding: 12px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    background: #EC2780; /* Đổi màu nền chữ thành hồng #EC2780 */
  }
</style>
</head>
<body>

<div class="slider-wrapper-pcl">
  <h2 class="slider-title-pcl">HỘI THI VĂN NGHỆ THIẾU NHI PHƯỜNG CAO LÃNH NĂM 2026 VỚI CHỦ ĐỀ: “EM YÊU QUÊ HƯƠNG”</h2>

  <div class="slider-container-pcl">
    <div class="slides-pcl">
      <img src="https://drive.google.com/thumbnail?id=1h5COf2SWxmtswIOjH0Jb4mtWe7Os9FHM&sz=w1000" class="active-pcl">
      <img src="https://drive.google.com/thumbnail?id=1I5fnlD4BiTuMHhuSURQ6XzrxtIUKM2Dq&sz=w1000">
      <img src="https://drive.google.com/thumbnail?id=1FWSryhL39dpeIi0Dgk7z-5MpEW_9Sr43&sz=w1000">
      <img src="https://drive.google.com/thumbnail?id=1HjI3bUMddfKCTdQIHAldk0XlYfl02Pwp&sz=w1000">
      <img src="https://drive.google.com/thumbnail?id=1n9rabO6JQC5lBGDKWhee86S2KX90xz5I&sz=w1000">
      <img src="https://drive.google.com/thumbnail?id=1Nz8fKxG089fJI7JOXubRJoRgYOODAKMi&sz=w1000">
    </div>

    <div class="thumbnails-pcl">
      <img src="https://drive.google.com/thumbnail?id=1h5COf2SWxmtswIOjH0Jb4mtWe7Os9FHM&sz=w200" class="active-pcl">
      <img src="https://drive.google.com/thumbnail?id=1I5fnlD4BiTuMHhuSURQ6XzrxtIUKM2Dq&sz=w200">
      <img src="https://drive.google.com/thumbnail?id=1FWSryhL39dpeIi0Dgk7z-5MpEW_9Sr43&sz=w200">
      <img src="https://drive.google.com/thumbnail?id=1HjI3bUMddfKCTdQIHAldk0XlYfl02Pwp&sz=w200">
      <img src="https://drive.google.com/thumbnail?id=1n9rabO6JQC5lBGDKWhee86S2KX90xz5I&sz=w200">
      <img src="https://drive.google.com/thumbnail?id=1Nz8fKxG089fJI7JOXubRJoRgYOODAKMi&sz=w200">
    </div>
  </div>

  <div class="caption-pcl">Ảnh 01</div>
</div>

<script>
(function(){
  let indexPcl = 0;
  const slidesPcl = document.querySelectorAll(".slides-pcl img");
  const thumbsPcl = document.querySelectorAll(".thumbnails-pcl img");
  const captionPcl = document.querySelector(".caption-pcl");
  
  // Tự động tạo mảng caption ngắn gọn: "Ảnh 01", "Ảnh 02"...
  const captionsPcl = Array.from({length: slidesPcl.length}, (_, i) => 
    'Ảnh ' + (i + 1).toString().padStart(2, '0')
  );

  const thumbnailsContainer = document.querySelector(".thumbnails-pcl");

  function showSlidePcl(i) {
    slidesPcl.forEach((img, idx) => img.classList.toggle("active-pcl", idx === i));
    thumbsPcl.forEach((img, idx) => img.classList.toggle("active-pcl", idx === i));
    
    // Khắc phục lỗi trôi trang: Chỉ tính toán và cuộn phần thanh thumbnail bên trong thay vì cuộn toàn trang
    const activeThumb = thumbsPcl[i];
    if(activeThumb && thumbnailsContainer) {
        const scrollLeftPos = activeThumb.offsetLeft - (thumbnailsContainer.clientWidth / 2) + (activeThumb.clientWidth / 2);
        thumbnailsContainer.scrollTo({
            left: scrollLeftPos,
            behavior: 'smooth'
        });
    }

    captionPcl.textContent = captionsPcl[i] || 'Ảnh 01';
    indexPcl = i;
  }

  thumbsPcl.forEach((thumb, i) => {
    thumb.addEventListener("click", () => {
      clearTimeout(timerPcl);
      showSlidePcl(i);
      autoSlidePcl();
    });
  });

  let timerPcl;
  function autoSlidePcl() {
    clearTimeout(timerPcl);
    timerPcl = setTimeout(() => {
      let next = (indexPcl + 1) % slidesPcl.length;
      showSlidePcl(next);
      autoSlidePcl();
    }, 5000);
  }

  showSlidePcl(indexPcl);
  autoSlidePcl();
})();
</script>

</body>
</html>
